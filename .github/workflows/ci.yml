name: CI

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install server dependencies
        working-directory: ./server
        run: |
          npm ci --prefer-offline
      - name: Run unit tests
        working-directory: ./server
        run: |
          npm run test:unit

  e2e-playwright:
    name: E2E (Playwright) - deterministic multi-page smoke
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install server deps + Playwright
        working-directory: ./server
        run: |
          npm ci --prefer-offline
          npm install --no-audit --no-fund -D playwright
      - name: Install Playwright browsers
        working-directory: ./server
        run: |
          npx playwright install --with-deps chromium
      - name: Run deterministic E2E runner
        env:
          CI: true
        run: |
          node tools/e2e/playwright/runner.js
