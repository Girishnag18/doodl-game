name: CI

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install server dependencies
        working-directory: ./server
        run: |
          npm ci --prefer-offline
      - name: Run unit tests
        working-directory: ./server
        run: |
          npm run test:unit

  e2e-playwright:
    name: E2E (Playwright) - deterministic multi-page smoke
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install server deps
        working-directory: ./server
        run: |
          npm ci --prefer-offline
      - name: Install Playwright at repo root and browsers
        run: |
          npm install --no-audit --no-fund -D playwright
          npx playwright install --with-deps chromium
      - name: Start server in background
        working-directory: ./server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          # wait for server to be ready
          for i in {1..30}; do
            if curl -sS http://localhost:3001/ > /dev/null; then
              echo "server ready"; break;
            fi
            sleep 1
          done
          tail -n +1 server.log | sed -n '1,200p'
      - name: Run deterministic E2E runner
        env:
          CI: true
        run: |
          node tools/e2e/playwright/runner.js
